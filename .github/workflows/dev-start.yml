name: Development startup

on:
  pull_request:
    paths:
      - .github/workflows/dev-start.yml
      - scripts/**
      - backend/.env.example
      - backend/app/core/config.py
      - backend/app/main.py
      - backend/app/services/box_operations.py
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-start.yml
      - scripts/**
      - backend/.env.example
      - backend/app/core/config.py
      - backend/app/main.py
      - backend/app/services/box_operations.py

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install locked backend dependencies
        run: uv sync --project backend --locked
      - name: Check shell syntax
        run: |
          bash -n scripts/dev.sh
          sh scripts/dev.sh --help
      - name: Test development startup
        run: uv run --project backend --no-sync python -m unittest discover -s scripts -p 'test_*.py' -v
