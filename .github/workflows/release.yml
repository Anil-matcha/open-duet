name: Release desktop

# Builds unsigned desktop installers when a version tag is pushed and attaches
# them to a GitHub release. Windows: NSIS installer (x64). macOS: DMG (arm64),
# without native desktop preview. Installers are not code-signed or notarized.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            glob: desktop/release/*.dmg
          - os: windows-latest
            glob: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Set up desktop and frontend dependencies
        working-directory: desktop
        run: npm run setup
      - name: Build the installer
        working-directory: desktop
        run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # Checksums let a downloader verify what they got: the installers are not
  # signed or notarised (see docs/SETUP.md), so this is the only integrity
  # signal. A single SHA256SUMS covers every installer.
  checksums:
    name: Checksums
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: installers
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: installers/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [package, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            installers/*
          generate_release_notes: true
          prerelease: true
