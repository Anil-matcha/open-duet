name: Release desktop

# Builds desktop installers when a version tag is pushed and attaches them to a
# GitHub release. Windows: NSIS installer (x64). macOS: signed and notarized DMG
# (arm64), without native desktop preview. The macOS job fails closed unless
# its Developer ID and App Store Connect secrets are configured.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            glob: desktop/release/*.dmg
          - os: windows-latest
            glob: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5.4.2
      - name: Set up desktop and frontend dependencies
        working-directory: desktop
        run: npm run setup
      - name: Require macOS signing credentials
        if: matrix.os == 'macos-14'
        working-directory: desktop
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_API_KEY: ${{ secrets.MAC_APPLE_API_KEY }}
          MAC_APPLE_API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          MAC_APPLE_API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD MAC_APPLE_API_KEY MAC_APPLE_API_KEY_ID MAC_APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name must be configured as a GitHub Actions secret for macOS releases."
              exit 1
            fi
          done
      - name: Build the installer
        working-directory: desktop
        run: npm run package
        env:
          DESKTOP_REQUIRE_SIGNING: ${{ matrix.os == 'macos-14' && '1' || '0' }}
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-14' && secrets.MAC_APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-14' && secrets.MAC_APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-14' && secrets.MAC_APPLE_API_ISSUER || '' }}
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: installers/*
          generate_release_notes: true
          prerelease: true
